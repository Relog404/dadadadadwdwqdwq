<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tele — мессенджер</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#f0f4f8;
  --card-bg:#ffffff;
  --text-main:#1e293b;
  --text-muted:#64748b;
  --border-color:#e2e8f0;
  --accent-color:#6366f1;
  --accent-light:#e0e7ff;
  --accent-hover:#4f46e5;
  --skeleton-bg:#f1f5f9;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05);
  --radius:12px;
  --radius-lg:16px;
  --sidebar-w:340px;
  --right-w:320px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg-color);color:var(--text-main);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* AUTH */
.auth-overlay{position:fixed;inset:0;background:var(--bg-color);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.auth-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:420px;padding:28px;animation:fadeInUp .5s ease}
.auth-card h1{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px}
.auth-card h1 span{width:36px;height:36px;border-radius:10px;background:var(--accent-color);display:grid;place-items:center;color:#fff;font-size:18px}
.auth-sub{color:var(--text-muted);font-size:14px;margin:8px 0 18px}
.tabs{display:flex;background:var(--skeleton-bg);border-radius:10px;padding:4px;gap:4px;margin-bottom:18px}
.tab{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;font-weight:600;font-size:14px;color:var(--text-muted);transition:.2s}
.tab.active{background:var(--card-bg);color:var(--text-main);box-shadow:var(--shadow-sm)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600;color:var(--text-muted)}
.field input, .field textarea, .field select{padding:11px 12px;border:1px solid var(--border-color);border-radius:10px;outline:none;font-size:14px;background:var(--card-bg);transition:.2s}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent-color);box-shadow:0 0 0 3px var(--accent-light)}
.btn-primary{width:100%;padding:11px;background:var(--accent-color);color:#fff;border:none;border-radius:10px;font-weight:600;font-size:14px;transition:.2s}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{padding:8px 12px;border-radius:8px;border:1px solid var(--border-color);background:var(--card-bg);font-weight:500;font-size:13px}
.hint{font-size:12px;color:var(--text-muted);text-align:center;margin-top:12px}
.demo-users{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.demo-chip{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--accent-light);color:var(--accent-color);border:none;font-weight:600}

/* APP SHELL */
.app{display:flex;height:100vh;opacity:0;pointer-events:none}
.app.ready{opacity:1;pointer-events:auto}
.sidebar{width:var(--sidebar-w);background:var(--card-bg);border-right:1px solid var(--border-color);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-top{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--border-color)}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:10px}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--accent-color);display:grid;place-items:center;color:#fff;font-style:normal}
.side-actions{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border-color);background:var(--card-bg);display:grid;place-items:center;font-size:16px}
.icon-btn:hover{border-color:var(--accent-color)}
.search{position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border-radius:999px;border:1px solid var(--border-color);background:var(--skeleton-bg);outline:none;font-size:14px}
.search input:focus{background:var(--card-bg);border-color:var(--accent-color)}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.filters{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border-color);background:var(--card-bg);font-size:12px;font-weight:600;white-space:nowrap;color:var(--text-muted)}
.chip.active{background:var(--accent-color);color:#fff;border-color:var(--accent-color)}
.chat-list{flex:1;overflow:auto;padding:8px}
.chat-item{display:flex;gap:10px;padding:10px;border-radius:var(--radius);cursor:pointer;transition:.15s;border:1px solid transparent}
.chat-item:hover{background:var(--skeleton-bg)}
.chat-item.active{background:var(--accent-light);border-color:#c7d2fe}
.chat-item.unread .chat-name{font-weight:700}
.avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;position:relative;overflow:hidden;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:2px solid #fff;box-shadow:var(--shadow-sm)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.online::after{content:'';position:absolute;right:0;bottom:0;width:10px;height:10px;background:#22c55e;border:2px solid #fff;border-radius:50%}
.chat-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.chat-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.chat-time{font-size:11px;color:var(--text-muted);flex-shrink:0}
.chat-last{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:999px;background:var(--accent-color);color:#fff}
.muted-dot{width:16px;height:16px;border-radius:50%;background:var(--skeleton-bg);display:grid;place-items:center;font-size:10px;color:var(--text-muted);border:1px solid var(--border-color)}
.me{ flex-shrink:0; padding:6px 10px; border-top:1px solid var(--border-color); display:flex; align-items:center; gap:10px; background:var(--card-bg)}
.me-info{flex:1;min-width:0}
.me-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.me-status{font-size:11px;color:var(--text-muted)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-color);position:relative}
.chat-header{height:56px;background:var(--card-bg);border-bottom:1px solid var(--border-color);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0}
.chat-header .title{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}
.subtitle{font-size:12px;color:var(--text-muted)}
.pinned{ background:var(--card-bg); border-bottom:1px solid var(--border-color); padding:8px 12px; display:flex; align-items:center; gap:10px; cursor:pointer }
.pinned-bar{width:3px;align-self:stretch;background:var(--accent-color);border-radius:99px}
.pinned span{font-size:12px}
.pinned strong{font-size:12px;color:var(--accent-color)}
.messages{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:
  radial-gradient(600px 300px at 20% 0%, #e0e7ff 0%, transparent 60%),
  radial-gradient(500px 300px at 90% 80%, #ddd6fe 0%, transparent 60%),
  var(--bg-color)}
.date-sep{align-self:center;background:var(--card-bg);border:1px solid var(--border-color);padding:4px 10px;border-radius:999px;font-size:11px;color:var(--text-muted);box-shadow:var(--shadow-sm)}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:75%;animation:fadeInUp .25s ease}
.msg-row.out{margin-left:auto;flex-direction:row-reverse}
.msg-row .avatar{width:28px;height:28px;font-size:11px}
.bubble{background:var(--card-bg);border:1px solid var(--border-color);border-radius:16px 16px 16px 4px;padding:8px 10px;box-shadow:var(--shadow-sm);position:relative;min-width:120px}
.msg-row.out .bubble{background:var(--accent-color);color:#fff;border-color:var(--accent-color);border-radius:16px 16px 4px 16px}
.bubble-head{font-size:11px;font-weight:700;color:var(--accent-color);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.msg-row.out .bubble-head{color:rgba(255,255,255,.9)}
.bubble-text{font-size:14px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.bubble-photo{margin:-8px -10px 6px;border-radius:12px 12px 0 0;overflow:hidden;max-height:260px}
.bubble-photo img{width:100%;display:block;cursor:pointer}
.bubble-footer{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:4px;font-size:11px;opacity:.8}
.tick{font-size:12px}
.actions{position:absolute;top:-10px;right:8px;background:var(--card-bg);border:1px solid var(--border-color);border-radius:999px;box-shadow:var(--shadow-md);display:flex;gap:2px;padding:3px;opacity:0;pointer-events:none;transform:translateY(4px);transition:.2s;z-index:2}
.bubble:hover .actions{opacity:1;pointer-events:auto;transform:none}
.act-btn{width:26px;height:26px;border-radius:50%;border:none;background:transparent;display:grid;place-items:center;font-size:12px}
.act-btn:hover{background:var(--skeleton-bg)}
.reply-preview{border-left:3px solid var(--accent-color);padding-left:8px;margin-bottom:6px;background:rgba(99,102,241,.06);border-radius:6px}
.reply-preview b{font-size:11px}
.reply-preview div{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.forwarded{font-size:11px;opacity:.8;display:flex;align-items:center;gap:4px;margin-bottom:4px;font-style:italic}
.reactions{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.reaction{font-size:12px;padding:2px 6px;border-radius:999px;background:var(--card-bg);border:1px solid var(--border-color);display:flex;align-items:center;gap:3px}
.msg-row.out .reaction{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2)}
.voice{ display:flex; align-items:center; gap:10px; min-width:220px}
.voice-play{width:34px;height:34px;border-radius:50%;background:var(--accent-color);color:#fff;display:grid;place-items:center;border:none;flex-shrink:0}
.wave{flex:1;height:24px;display:flex;align-items:center;gap:2px}
.wave i{width:3px;background:currentColor;border-radius:99px;display:block}
.location{border-radius:10px;overflow:hidden;border:1px solid var(--border-color);background:var(--skeleton-bg);padding:8px;display:flex;flex-direction:column;gap:6px}
.location-map{height:120px;border-radius:8px;background:linear-gradient(135deg,#c7d2fe,#e0e7ff);display:grid;place-items:center;font-size:24px;position:relative}
.video-circle{width:160px;height:160px;border-radius:50%;overflow:hidden;border:3px solid var(--accent-color);background:#000;display:grid;place-items:center;position:relative}
.video-circle video{width:100%;height:100%;object-fit:cover}
.video-circle::after{content:'● REC';position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.9);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:999px}
.composer{ background:var(--card-bg); border-top:1px solid var(--border-color); padding:10px; display:flex; flex-direction:column; gap:8px; flex-shrink:0}
.reply-bar{ display:none; align-items:center; gap:8px; background:var(--skeleton-bg); border-left:3px solid var(--accent-color); padding:8px 10px; border-radius:10px }
.reply-bar.show{display:flex}
.composer-row{display:flex;align-items:flex-end;gap:8px}
.attach-menu{position:relative}
.attach-panel{position:absolute;bottom:44px;left:0;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;display:none;flex-direction:column;gap:6px;min-width:180px;z-index:5}
.attach-panel.show{display:flex}
.attach-panel button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:none;background:transparent;font-size:13px;font-weight:500;text-align:left}
.attach-panel button:hover{background:var(--skeleton-bg)}
.input-wrap{flex:1;min-height:42px;max-height:120px;background:var(--skeleton-bg);border:1px solid var(--border-color);border-radius:14px;display:flex;align-items:center;gap:8px;padding:6px 8px}
.input-wrap textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:14px;line-height:1.4;max-height:90px;padding:6px}
.send{width:42px;height:42px;border-radius:12px;background:var(--accent-color);color:#fff;border:none;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.send:disabled{opacity:.5}
.record{width:42px;height:42px;border-radius:12px;background:var(--card-bg);border:1px solid var(--border-color);display:grid;place-items:center;font-size:18px}
.record.rec{background:#ef4444;color:#fff;border-color:#ef4444;animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.empty{flex:1;display:grid;place-items:center;padding:24px;text-align:center;color:var(--text-muted)}
.empty-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--radius-lg);padding:24px;max-width:420px;box-shadow:var(--shadow-md)}

/* RIGHT */
.right{width:var(--right-w);background:var(--card-bg);border-left:1px solid var(--border-color);display:flex;flex-direction:column;flex-shrink:0}
.right-head{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border-color);font-weight:700}
.right-body{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.profile-card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.profile-card .big-avatar{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px;background:linear-gradient(135deg,#6366f1,#06b6d4);margin:0 auto;position:relative;overflow:hidden}
.profile-card .big-avatar img{width:100%;height:100%;object-fit:cover}
.verified{ width:16px;height:16px;border-radius:50%;background:var(--accent-color);color:#fff;display:inline-grid;place-items:center;font-size:10px;flex-shrink:0 }
.verified.gold{background:#eab308}
.verified.green{background:#22c55e}
.verified.premium{background:linear-gradient(135deg,#6366f1,#ec4899)}
.muted{color:var(--text-muted);font-size:13px}
.members{display:flex;flex-direction:column;gap:8px}
.member{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:1px solid var(--border-color);background:var(--card-bg)}
.member small{color:var(--text-muted)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.media-grid img{width:100%;height:80px;object-fit:cover;border-radius:10px;border:1px solid var(--border-color)}

/* WIDGETS used in empty/info */
.widget{background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:16px;display:flex;flex-direction:column;gap:10px;animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.skeleton{background:var(--skeleton-bg);border-radius:8px;position:relative;overflow:hidden}
.skeleton::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:loading 1.6s infinite}
@keyframes loading{100%{transform:translateX(100%)}}

/* MODALS */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.modal-card{background:var(--card-bg);border-radius:16px;border:1px solid var(--border-color);box-shadow:var(--shadow-lg);width:100%;max-width:440px;padding:20px;max-height:90vh;overflow:auto}
.modal-card h3{font-size:16px;margin-bottom:10px}
.row{display:flex;gap:8px}
.row > *{flex:1}

/* typing */
.typing{font-size:12px;color:var(--accent-color);font-style:italic}

/* mobile */
.mobile-bar{display:none}
@media(max-width:900px){
  .right{display:none}
  .right.open{display:flex;position:fixed;inset:0 0 0 auto;width:100%;max-width:380px;z-index:20}
  .sidebar{position:fixed;inset:0 auto 0 0;width:100%;max-width:380px;z-index:16;transform:translateX(-100%);transition:.25s}
  .sidebar.open{transform:none}
  .mobile-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card-bg);border-bottom:1px solid var(--border-color)}
}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth" class="auth-overlay">
  <div class="auth-card">
    <h1><span>✦</span> Tele</h1>
    <div class="auth-sub">Аналог Telegram — общайся, создавай каналы и группы</div>
    <div class="tabs">
      <button class="tab active" data-tab="login">Вход</button>
      <button class="tab" data-tab="register">Регистрация</button>
    </div>
    <div id="loginForm">
      <div class="field"><label>Логин</label><input id="loginUser" placeholder="например, alex"></div>
      <div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="••••••••"></div>
      <button class="btn-primary" onclick="doLogin()">Войти</button>
      <div class="hint">Демо-аккаунты — нажми чтобы войти:</div>
      <div class="demo-users" id="demoUsers"></div>
    </div>
    <div id="registerForm" style="display:none">
      <div class="field"><label>Логин (уникальный)</label><input id="regLogin" placeholder="my_nick"></div>
      <div class="field"><label>Имя</label><input id="regName" placeholder="Алексей"></div>
      <div class="field"><label>Пароль</label><input id="regPass" type="password" placeholder="минимум 4 символа"></div>
      <div class="field"><label>Аватар (URL, не обязательно)</label><input id="regAvatar" placeholder="https://..."></div>
      <div class="field"><label>Тип галочки</label>
        <select id="regBadge">
          <option value="">Без галочки</option>
          <option value="blue">Синяя — верификация</option>
          <option value="gold">Золотая — бизнес</option>
          <option value="green">Зелёная — поддержка</option>
          <option value="premium">Премиум — градиент</option>
        </select>
      </div>
      <button class="btn-primary" onclick="doRegister()">Создать аккаунт</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand"><i>✦</i> Tele <span style="margin-left:auto;display:flex;gap:6px"><button class="icon-btn" onclick="openCreate('group')" title="Создать группу">👥</button><button class="icon-btn" onclick="openCreate('channel')" title="Создать канал">📢</button><button class="icon-btn" onclick="openProfile()" title="Профиль">⚙️</button></span></div>
      <div class="search"><span>🔍</span><input id="search" placeholder="Поиск по чатам и сообщениям" oninput="renderChats()"></div>
      <div class="filters" id="filters"></div>
      <div class="side-actions">
        <button class="btn-ghost" style="flex:1" onclick="openCreate('private')">＋ Новый чат</button>
        <button class="btn-ghost" onclick="logout()">Выйти</button>
      </div>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="me" id="meBar"></div>
  </div>

  <div class="main">
    <div class="mobile-bar"><button class="icon-btn" onclick="toggleSidebar()">☰</button><b>Tele</b><button class="icon-btn" onclick="toggleRight()">ℹ️</button></div>
    <div id="chatHeader" class="chat-header" style="display:none"></div>
    <div id="pinned" class="pinned" style="display:none" onclick="scrollToPinned()"></div>
    <div id="messages" class="messages"></div>
    <div id="composer" class="composer" style="display:none">
      <div id="replyBar" class="reply-bar"><div style="flex:1"><b id="replyName" style="font-size:12px;color:var(--accent-color)"></b><div id="replyText" style="font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div></div><button class="icon-btn" onclick="cancelReply()">✕</button></div>
      <div id="editBar" class="reply-bar"><div style="flex:1"><b style="font-size:12px;color:#eab308">Редактирование</b><div id="editText" style="font-size:12px;color:var(--text-muted)"></div></div><button class="icon-btn" onclick="cancelEdit()">✕</button></div>
      <div class="composer-row">
        <div class="attach-menu">
          <button class="icon-btn" onclick="toggleAttach()">📎</button>
          <div id="attachPanel" class="attach-panel">
            <button onclick="triggerPhoto()">🖼️ Фото / файл</button>
            <button onclick="sendLocation()">📍 Геолокация</button>
            <button onclick="sendVideoCircle()">⭕ Видеокружок</button>
            <button onclick="insertEmoji()">😊 Эмодзи</button>
          </div>
        </div>
        <div class="input-wrap">
          <textarea id="msgInput" rows="1" placeholder="Сообщение" onkeydown="onInputKey(event)" oninput="autoGrow(this); onTyping()"></textarea>
          <button class="icon-btn" onclick="insertEmoji()" title="Эмодзи">😊</button>
        </div>
        <button id="recordBtn" class="record" title="Голосовое" onmousedown="startVoice(event)" onmouseup="stopVoice(event)" ontouchstart="startVoice(event)" ontouchend="stopVoice(event)">🎙️</button>
        <button id="sendBtn" class="send" onclick="sendMessage()">➤</button>
      </div>
      <div id="typingHint" class="typing" style="display:none"></div>

    <div class="right-head"><span>Информация</span><button class="icon-btn" onclick="toggleRight()">✕</button></div>
    <div class="right-body" id="rightBody"></div>
  </div>
</div>

  <div class="modal-card">
    <h3 id="createTitle">Создать</h3>

    <div class="field"><label>Описание</label><textarea id="createDesc" rows="2" placeholder="О чём чат?"></textarea></div>
    <div class="field" id="createMembersField"><label>Участники (логины через запятую)</label><input id="createMembers" placeholder="alice, bob"></div>
    <div class="field" id="createPrivateField" style="display:none"><label>Логин собеседника</label><input id="createPrivate" placeholder="username"></div>
    <div class="row"><button class="btn-ghost" onclick="closeModal('createModal')">Отмена</button><button class="btn-primary" onclick="doCreate()">Создать</button></div>

<div id="profileModal" class="modal" onclick="if(event.target===this)closeModal('profileModal')">
  <div class="modal-card">

    <div class="field"><label>Имя</label><input id="pfName"></div>
    <div class="field"><label>Логин</label><input id="pfLogin"></div>
    <div class="field"><label>О себе</label><textarea id="pfBio" rows="2"></textarea></div>
    <div class="field"><label>Аватар URL</label><input id="pfAvatar" placeholder="https://..."></div>
    <div class="field"><label>Галочка</label>
      <select id="pfBadge"><option value="">Без</option><option value="blue">Синяя</option><option value="gold">Золотая</option><option value="green">Зелёная</option><option value="premium">Премиум</option></select>
    </div>
    <div class="row"><button class="btn-ghost" onclick="closeModal('profileModal')">Закрыть</button><button class="btn-primary" onclick="saveProfile()">Сохранить</button></div>
  </div>
</div>

<div id="lightbox" class="modal" onclick="closeModal('lightbox')"><div class="modal-card" style="max-width:700px;padding:10px"><img id="lightboxImg" style="width:100%;border-radius:12px;display:block"></div></div>

<script>
const LS_USERS='tele_users', LS_CHATS='tele_chats', LS_MSGS='tele_msgs', LS_SESSION='tele_session';
let users=[], chats=[], messages=[], currentUser=null, activeChatId=null;
let replyTo=null, editId=null, pinnedToScroll=null, filter='all', createType='group';
let isRecording=false, recordStart=0, recordTimer=null;
let typingTimeout=null;

const badgeMap={blue:'🔵',gold:'🟡',green:'🟢',premium:'💎'};
const badgeClass={blue:'',gold:'gold',green:'green',premium:'premium'};

function uid(){return Math.random().toString(36).slice(2,9)}
function now(){return Date.now()}
function save(){localStorage.setItem(LS_USERS,JSON.stringify(users));localStorage.setItem(LS_CHATS,JSON.stringify(chats));localStorage.setItem(LS_MSGS,JSON.stringify(messages))}
function load(){
  try{users=JSON.parse(localStorage.getItem(LS_USERS)||'[]');chats=JSON.parse(localStorage.getItem(LS_CHATS)||'[]');messages=JSON.parse(localStorage.getItem(LS_MSGS)||'[]')}catch{}
}
function seed(){
  if(users.length) return;
  users=[
    {id:'u1',login:'alex',pass:'1234',name:'Алексей',bio:'Люблю код и кофе',avatar:'',badge:'blue',online:true},
    {id:'u2',login:'maria',pass:'1234',name:'Мария',bio:'Дизайнер · Figma ♥',avatar:'',badge:'premium',online:true},
    {id:'u3',login:'dima',pass:'1234',name:'Дима',bio:'Канал про стартапы',avatar:'',badge:'gold',online:false},
    {id:'u4',login:'support',pass:'1234',name:'Поддержка',bio:'Отвечаем 24/7',avatar:'',badge:'green',online:true},
  ];
  chats=[
    {id:'c1',type:'private',title:'',members:['u1','u2'],owner:'u1',admins:[],desc:'',avatar:'',muted:false},
    {id:'c2',type:'group',title:'Дизайн-чат',members:['u1','u2','u3'],owner:'u1',admins:['u1'],desc:'Обсуждаем UI и стиль',avatar:'',muted:false},
    {id:'c3',type:'channel',title:'Новости Tele',members:['u1','u2','u3','u4'],owner:'u4',admins:['u4'],desc:'Официальный канал',avatar:'',muted:false,subscribers:['u1','u2','u3','u4']},
    {id:'c4',type:'private',title:'',members:['u1','u4'],owner:'u1',admins:[],desc:'',avatar:'',muted:false},
  ];
  messages=[
    {id:uid(),chatId:'c1',senderId:'u2',type:'text',content:'Привет! Как тебе новый стиль?',ts:now()-100000,replyTo:null,edited:false,pinned:false,reactions:[],read:true},
    {id:uid(),chatId:'c1',senderId:'u1',type:'text',content:'Очень нравится 😍 Светлый, чистый',ts:now()-90000,replyTo:null,edited:false,pinned:false,reactions:[{emoji:'❤️',by:['u2']}],read:true},
    {id:uid(),chatId:'c2',senderId:'u3',type:'text',content:'Ребята, зацените мой концепт',ts:now()-80000,replyTo:null,edited:false,pinned:false,reactions:[],read:true},
    {id:uid(),chatId:'c2',senderId:'u3',type:'photo',content:'https://picsum.photos/seed/tele1/600/400',caption:'Концепт лендинга',ts:now()-79000,replyTo:null,edited:false,pinned:true,reactions:[],read:true},
    {id:uid(),chatId:'c3',senderId:'u4',type:'text',content:'Добро пожаловать в Tele! Канал для анонсов и обновлений.',ts:now()-70000,replyTo:null,edited:false,pinned:true,reactions:[{emoji:'🔥',by:['u1','u2']}],read:true},
  ];
  save();
}

function getUser(id){return users.find(u=>u.id===id)}
function getUserByLogin(login){return users.find(u=>u.login===login)}
function chatTitle(chat){
  if(chat.type!=='private') return chat.title;
  const otherId=chat.members.find(m=>m!==currentUser.id);
  const u=getUser(otherId); return u?u.name:chat.title||'Чат';
}
function chatAvatar(chat){
  if(chat.type!=='private') return chat.title?.[0]?.toUpperCase()||'G';
  const other=getUser(chat.members.find(m=>m!==currentUser.id)); return other? (other.name[0]||'U') : 'U';
}
function avatarHtml(userOrChat, size){
  let url='', letter='';
  if(userOrChat.members){ // chat
    const ch=userOrChat;
    if(ch.avatar) url=ch.avatar;
    else if(ch.type==='private'){ const o=getUser(ch.members.find(m=>m!==currentUser.id)); if(o&&o.avatar) url=o.avatar; letter=chatAvatar(ch)}
    else letter=(ch.title||'?')[0];
  } else {
    if(userOrChat.avatar) url=userOrChat.avatar;
    letter=(userOrChat.name||userOrChat.login||'?')[0];
  }
  const style=size?`width:${size}px;height:${size}px;`:'';
  if(url) return `<div class="avatar" style="${style}"><img src="${url}" onerror="this.remove()">${letter}</div>`;
  return `<div class="avatar" style="${style}">${letter}</div>`;
}
function badgeHtml(b){
  if(!b) return '';
  const cls=badgeClass[b]||'';
  return `<span class="verified ${cls}" title="${b}">✓</span>`;
}
function timeStr(ts){
  const d=new Date(ts);
  return d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}
function dateStr(ts){
  return new Date(ts).toLocaleDateString('ru',{day:'numeric',month:'long'});
}

// FILTERS
const filterDefs=[{id:'all',label:'Все'},{id:'private',label:'Личные'},{id:'group',label:'Группы'},{id:'channel',label:'Каналы'},{id:'unread',label:'Непрочитано'}];
function renderFilters(){
  const el=document.getElementById('filters'); el.innerHTML='';
  filterDefs.forEach(f=>{
    const b=document.createElement('button'); b.className='chip'+(filter===f.id?' active':''); b.textContent=f.label; b.onclick=()=>{filter=f.id;renderFilters();renderChats()}; el.appendChild(b);
  });
}

function lastMsg(chatId){
  const arr=messages.filter(m=>m.chatId===chatId).sort((a,b)=>b.ts-a.ts); return arr[0];
}
function unreadCount(chatId){
  return messages.filter(m=>m.chatId===chatId && m.senderId!==currentUser.id && !m.read).length;
}

function renderChats(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const list=document.getElementById('chatList'); list.innerHTML='';
  let filtered=[...chats];
  // only chats where current user is member
  filtered=filtered.filter(c=>c.members.includes(currentUser.id));
  if(filter==='private') filtered=filtered.filter(c=>c.type==='private');
  if(filter==='group') filtered=filtered.filter(c=>c.type==='group');
  if(filter==='channel') filtered=filtered.filter(c=>c.type==='channel');
  if(filter==='unread') filtered=filtered.filter(c=>unreadCount(c.id)>0);
  if(q){
    filtered=filtered.filter(c=>{
      const t=chatTitle(c).toLowerCase();
      const lm=lastMsg(c.id); const txt=(lm? lm.content + ' ' + (lm.caption||'') : '').toLowerCase();
      return t.includes(q)||txt.includes(q);
    });
  }
  // sort by last message ts
  filtered.sort((a,b)=>(lastMsg(b.id)?.ts||0)-(lastMsg(a.id)?.ts||0));
  if(!filtered.length){
    list.innerHTML=`<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">Чатов нет. Создайте новый.</div>`;
    return;
  }
  filtered.forEach(ch=>{
    const lm=lastMsg(ch.id);
    const unread=unreadCount(ch.id);
    const div=document.createElement('div');
    div.className='chat-item'+(ch.id===activeChatId?' active':'') + (unread?' unread':'');
    div.onclick=()=>openChat(ch.id);
    const typeIcon= ch.type==='channel'?'📢': ch.type==='group'?'👥':'';
    div.innerHTML=`
      ${avatarHtml(ch)}
      <div class="chat-meta">
        <div class="chat-head"><div class="chat-name">${typeIcon} ${chatTitle(ch)} ${ch.type==='channel' && ch.owner? badgeHtml(getUser(ch.owner)?.badge):''}</div><div class="chat-time">${lm? timeStr(lm.ts):''}</div></div>
        <div class="chat-last"><span>${lm? (lm.senderId===currentUser.id?'Вы: ':'') + (lm.type==='photo'?'🖼️ Фото': lm.type==='voice'?'🎤 Голосовое': lm.type==='location'?'📍 Геолокация': lm.type==='video_circle'?'⭕ Видеокружок': (lm.content||lm.caption||'').slice(0,40)) : (ch.desc||'нет сообщений')}</span>
          ${unread? `<span class="badge">${unread}</span>`:''}
          ${ch.muted? `<span class="muted-dot">🔕</span>`:''}
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

function renderMeBar(){
  const el=document.getElementById('meBar');
  el.innerHTML=`${avatarHtml(currentUser,36)}<div class="me-info"><div class="me-name">${currentUser.name} ${badgeHtml(currentUser.badge)}</div><div class="me-status">@${currentUser.login} • в сети</div></div><button class="icon-btn" onclick="openProfile()">✎</button>`;
}

function openChat(id){
  activeChatId=id;
  // mark read
  messages.forEach(m=>{if(m.chatId===id) m.read=true}); save();
  renderChats(); renderHeader(); renderPinned(); renderMessages(); renderRight();
  document.getElementById('composer').style.display='flex';
  document.getElementById('sidebar').classList.remove('open');
  setTimeout(()=>{ const cont=document.getElementById('messages'); cont.scrollTop=cont.scrollHeight; },50);
}

function renderHeader(){
  const ch=chats.find(c=>c.id===activeChatId); if(!ch) return;
  const el=document.getElementById('chatHeader'); el.style.display='flex';
  const count = ch.type==='private' ? (getUser(ch.members.find(m=>m!==currentUser.id))?.online?'в сети':'был(а) недавно') : `${ch.members.length} участников`;
  const isChannel = ch.type==='channel';
  const canPost = !isChannel || ch.owner===currentUser.id || ch.admins.includes(currentUser.id);
  el.innerHTML=`
    <button class="icon-btn" onclick="toggleSidebar()" style="display:none" class="mob">☰</button>
    ${avatarHtml(ch,36)}
    <div style="flex:1;min-width:0"><div class="title">${chatTitle(ch)} ${ch.type==='group'?'👥': ch.type==='channel'?'📢':''} ${badgeHtml(getUser(ch.owner)?.badge||'')}</div><div class="subtitle">${isChannel? ch.desc||'канал' : count}${ch.muted?' • 🔕 без звука':''}</div></div>
    <button class="icon-btn" onclick="toggleMute()">${ch.muted?'🔕':'🔔'}</button>
    <button class="icon-btn" onclick="toggleRight()">ℹ️</button>
    <button class="icon-btn" onclick="showChatMenu()">⋯</button>
  `;
  // disable composer if channel and not admin
  const comp=document.getElementById('composer');
  if(!canPost){
    comp.style.display='none';
    // show subscribe
    const msgs=document.getElementById('messages');
  } else {
    if(activeChatId) comp.style.display='flex';
  }
}

function renderPinned(){
  const ch=chats.find(c=>c.id===activeChatId); if(!ch) return;
  const pinned=messages.filter(m=>m.chatId===activeChatId && m.pinned).sort((a,b)=>b.ts-a.ts)[0];
  const el=document.getElementById('pinned');
  if(pinned){
    el.style.display='flex';
    el.innerHTML=`<div class="pinned-bar"></div><div style="flex:1"><strong>Закреплённое сообщение</strong><span> — ${(pinned.content||pinned.caption||'').slice(0,60)}</span></div><span style="color:var(--accent-color)">📌</span>`;
    pinnedToScroll=pinned.id;
  } else { el.style.display='none'; pinnedToScroll=null; }
}
function scrollToPinned(){
  if(!pinnedToScroll) return;
  const el=document.querySelector(`[data-msg="${pinnedToScroll}"]`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'center'}), el.style.outline='2px solid var(--accent-color)', setTimeout(()=>el.style.outline='',1200);
}

function msgHtml(m){
  const isOut=m.senderId===currentUser.id;
  const user=getUser(m.senderId);
  const reply=m.replyTo? messages.find(x=>x.id===m.replyTo):null;
  const fwdFrom=m.forwardedFrom? getUser(m.forwardedFrom):null;
  let content='';
  if(fwdFrom) content+=`<div class="forwarded">↪ Переслано от ${fwdFrom.name}</div>`;
  if(reply) content+=`<div class="reply-preview"><b>${getUser(reply.senderId)?.name||''}</b><div>${reply.content||reply.caption||'[медиа]'}</div></div>`;
  if(m.type==='text'){
    content+=`<div class="bubble-text">${escapeHtml(m.content)} ${m.edited?'<span style="opacity:.7;font-size:11px"> (изменено)</span>':''}</div>`;
  } else if(m.type==='photo'){
    content+=`<div class="bubble-photo"><img src="${m.content}" onclick="openLightbox('${m.content}')"></div>${m.caption?`<div class="bubble-text">${escapeHtml(m.caption)}</div>`:''}`;
  } else if(m.type==='voice'){
    const dur=m.duration||3;
    content+=`<div class="voice"><button class="voice-play" onclick="playVoice(this,'${m.content}')">▶</button><div class="wave">${'<i style="height:'+(8+Math.random()*16)+'px"></i>'.repeat(18)}</div><span style="font-size:12px">${dur}″</span></div>`;
  } else if(m.type==='location'){
    const [lat,lon]=m.content.split(',');
    content+=`<div class="location"><div class="location-map">📍<span style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:var(--card-bg);padding:3px 8px;border-radius:999px;font-size:11px;border:1px solid var(--border-color)">${lat}, ${lon}</span></div><a href="https://maps.google.com/?q=${lat},${lon}" target="_blank" style="font-size:12px;color:var(--accent-color);text-align:center">Открыть карты</a></div>`;
  } else if(m.type==='video_circle'){
    content+=`<div class="video-circle"><video src="${m.content}" autoplay loop muted playsinline></video></div><div style="font-size:11px;opacity:.7;text-align:center;margin-top:4px">видеокружок</div>`;
  } else if(m.type==='system'){
    content+=`<div class="bubble-text" style="font-style:italic;opacity:.8">${escapeHtml(m.content)}</div>`;
  }
  const reactionsHtml = m.reactions?.length? `<div class="reactions">${m.reactions.map(r=>`<span class="reaction">${r.emoji} ${r.by.length}</span>`).join('')}</div>`:'';
  const ticks = isOut? `<span class="tick">${m.read?'✓✓':'✓'}</span>`:'';
  return `
    <div class="msg-row ${isOut?'out':''}" data-msg="${m.id}">
      ${!isOut? avatarHtml(user,28):''}
      <div class="bubble">
        ${!isOut? `<div class="bubble-head">${user?user.name:''} ${badgeHtml(user?.badge)}</div>`:''}
        ${content}
        ${reactionsHtml}
        <div class="bubble-footer"><span>${timeStr(m.ts)}</span>${ticks}</div>
        <div class="actions">
          <button class="act-btn" title="Ответить" onclick="setReply('${m.id}')">↩️</button>
          <button class="act-btn" title="Реакция" onclick="react('${m.id}')">❤️</button>
          <button class="act-btn" title="Закрепить" onclick="pinMsg('${m.id}')">📌</button>
          <button class="act-btn" title="Переслать" onclick="forwardMsg('${m.id}')">↪</button>
          ${isOut? `<button class="act-btn" title="Редактировать" onclick="startEdit('${m.id}')">✎</button><button class="act-btn" title="Удалить" onclick="deleteMsg('${m.id}')">🗑️</button>`:''}
        </div>
      </div>
    </div>
  `;
}
function renderMessages(){
  const cont=document.getElementById('messages');
  if(!activeChatId){
    cont.innerHTML=`<div class="empty"><div class="empty-card">
      <div style="font-size:28px">✦</div>
      <h3 style="margin:8px 0 6px">Добро пожаловать в Tele</h3>
      <p class="muted">Выберите чат слева или создайте новый. Поддерживаются текст, фото, голосовые, геолокация и видеокружки.</p>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="widget"><div style="font-weight:700;font-size:13px">⚡ Быстро</div><div class="skeleton" style="height:8px;width:80%"></div><div class="skeleton" style="height:8px;width:60%"></div></div>
        <div class="widget"><div style="font-weight:700;font-size:13px">🔒 Приватно</div><div class="skeleton" style="height:8px;width:90%"></div></div>
        <div class="widget" style="grid-column:span 2"><div style="display:flex;gap:10px;align-items:center"><div class="avatar" style="width:32px;height:32px"></div><div class="skeleton" style="height:10px;flex:1"></div></div><div class="skeleton" style="height:80px"></div></div>
      </div>
    </div></div>`;
    return;
  }
  const msgs=messages.filter(m=>m.chatId===activeChatId).sort((a,b)=>a.ts-b.ts);
  if(!msgs.length){
    cont.innerHTML=`<div class="empty"><div class="empty-card"><h3>Нет сообщений</h3><p class="muted">Напишите первым — поддерживаются фото, голос и гео.</p></div></div>`;
    return;
  }
  let html='', lastDate='';
  msgs.forEach(m=>{
    const d=dateStr(m.ts);
    if(d!==lastDate){ html+=`<div class="date-sep">${d}</div>`; lastDate=d; }
    html+=msgHtml(m);
  });
  cont.innerHTML=html;
  cont.scrollTop=cont.scrollHeight;
}

function renderRight(){
  const el=document.getElementById('rightBody');
  if(!activeChatId){ el.innerHTML=`<div class="widget"><div style="font-weight:700">Tele</div><p class="muted">Выберите чат чтобы увидеть информацию</p></div>`; return; }
  const ch=chats.find(c=>c.id===activeChatId);
  const other= ch.type==='private'? getUser(ch.members.find(m=>m!==currentUser.id)):null;
  const isChannel= ch.type==='channel';
  let html='';
  if(ch.type==='private' && other){
    html+=`<div class="profile-card"><div class="big-avatar">${other.avatar?`<img src="${other.avatar}">`: other.name[0]}</div><div style="text-align:center"><div style="font-weight:700;display:flex;justify-content:center;gap:6px;align-items:center">${other.name} ${badgeHtml(other.badge)}</div><div class="muted">@${other.login}</div><div class="muted" style="margin-top:6px">${other.bio||''}</div><div class="muted">${other.online?'в сети':'был(а) недавно'}</div></div><div class="row"><button class="btn-ghost" onclick="toggleMute()">${ch.muted?'🔔 Включить':'🔕 Мьют'}</button><button class="btn-ghost" onclick="openProfileOf('${other.id}')">Профиль</button></div></div>`;
  } else {
    html+=`<div class="profile-card"><div class="big-avatar">${(ch.avatar?`<img src="${ch.avatar}">`: (ch.title[0]||'C'))}</div><div style="text-align:center"><div style="font-weight:700">${ch.title} ${isChannel?'📢':'👥'}</div><div class="muted">${ch.desc||''}</div><div class="muted">${ch.members.length} участников</div></div><div class="row"><button class="btn-ghost" onclick="toggleMute()">${ch.muted?'🔔':'🔕'} Мьют</button><button class="btn-ghost" onclick="editChat()">✎ Изменить</button></div></div>`;
    html+=`<div class="widget"><div style="font-weight:700;font-size:14px">Участники</div><div class="members">${ch.members.map(mid=>{const u=getUser(mid);return `<div class="member">${avatarHtml(u,30)}<div style="flex:1"><div style="font-size:13px;font-weight:600;display:flex;gap:4px;align-items:center">${u.name} ${badgeHtml(u.badge)}</div><small>@${u.login} ${ch.owner===mid?'• владелец': ch.admins.includes(mid)?'• админ':''}</small></div>${mid!==currentUser.id?`<button class="btn-ghost" onclick="startPrivate('${u.login}')">Написать</button>`:''}</div>`}).join('')}</div>${ch.type!=='channel'?`<div style="margin-top:8px" class="field"><input id="addMemberInput" placeholder="логин чтобы добавить"><button class="btn-primary" style="margin-top:6px" onclick="addMember()">Добавить</button></div>`:''}</div>`;
  }
  const photos=messages.filter(m=>m.chatId===activeChatId && m.type==='photo').slice(-6);
  if(photos.length){
    html+=`<div class="widget"><div style="font-weight:700;font-size:14px">Медиа</div><div class="media-grid">${photos.map(p=>`<img src="${p.content}" onclick="openLightbox('${p.content}')">`).join('')}</div></div>`;
  }
  html+=`<div class="widget"><div style="font-weight:700;font-size:14px">Действия</div><button class="btn-ghost" onclick="clearChat()">🧹 Очистить чат</button><button class="btn-ghost" style="color:#ef4444;border-color:#fecaca" onclick="leaveChat()">🚪 Выйти / Удалить</button></div>`;
  el.innerHTML=html;
}

// composer helpers
function autoGrow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,90)+'px';}
function onInputKey(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
}
function onTyping(){
  const hint=document.getElementById('typingHint');
  // simulate peer typing occasionally
}
function sendMessage(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();
  if(!text && !editId) return;
  if(editId){
    const m=messages.find(x=>x.id===editId);
    if(m){ m.content=text; m.edited=true; }
    editId=null; document.getElementById('editBar').classList.remove('show');
  } else {
    const ch=chats.find(c=>c.id===activeChatId);
    if(!ch) return;
    // channel permission
    if(ch.type==='channel' && ch.owner!==currentUser.id && !ch.admins.includes(currentUser.id)){ alert('Только админы могут писать в канал'); return; }
    const msg={id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'text',content:text,ts:now(),replyTo:replyTo,forwardedFrom:null,edited:false,pinned:false,reactions:[],read:false};
    messages.push(msg);
    // simulate echo in private chats
    if(ch.type==='private'){
      const otherId=ch.members.find(m=>m!==currentUser.id);
      setTimeout(()=>{
        const replies=['👍','Понял!','Согласен','😂','Давай созвонимся','Окей','Супер'];
        messages.push({id:uid(),chatId:activeChatId,senderId:otherId,type:'text',content:replies[Math.floor(Math.random()*replies.length)],ts:now(),replyTo:null,edited:false,pinned:false,reactions:[],read:false});
        save(); if(activeChatId===ch.id){ renderMessages(); renderChats(); }
      }, 1200+Math.random()*1200);
    }
  }
  input.value=''; autoGrow(input); replyTo=null; document.getElementById('replyBar').classList.remove('show');
  save(); renderMessages(); renderChats(); renderPinned();
}
function setReply(id){
  replyTo=id;
  const m=messages.find(x=>x.id===id);
  document.getElementById('replyBar').classList.add('show');
  document.getElementById('replyName').textContent=getUser(m.senderId)?.name||'Сообщение';
  document.getElementById('replyText').textContent=m.content||m.caption||'[медиа]';
  document.getElementById('msgInput').focus();
}
function cancelReply(){ replyTo=null; document.getElementById('replyBar').classList.remove('show');}
function startEdit(id){
  const m=messages.find(x=>x.id===id);
  editId=id;
  document.getElementById('editBar').classList.add('show');
  document.getElementById('editText').textContent=m.content.slice(0,40);
  document.getElementById('msgInput').value=m.content; document.getElementById('msgInput').focus();
}
function cancelEdit(){ editId=null; document.getElementById('editBar').classList.remove('show'); document.getElementById('msgInput').value='';}
function deleteMsg(id){
  if(!confirm('Удалить сообщение?')) return;
  messages=messages.filter(m=>m.id!==id); save(); renderMessages(); renderChats(); renderPinned();
}
function pinMsg(id){
  const m=messages.find(x=>x.id===id); if(!m) return;
  // only owner/admin in channel can pin? allow all for demo
  m.pinned=!m.pinned; save(); renderMessages(); renderPinned();
}
function react(id){
  const emojis=['❤️','🔥','👍','😂','🎉','👏'];
  const e=prompt('Выберите реакцию: '+emojis.join(' ')+' (введите эмодзи)','❤️');
  if(!e) return;
  const m=messages.find(x=>x.id===id);
  let r=m.reactions.find(x=>x.emoji===e);
  if(!r){ m.reactions.push({emoji:e,by:[currentUser.id]}); }
  else { if(r.by.includes(currentUser.id)) r.by=r.by.filter(x=>x!==currentUser.id); else r.by.push(currentUser.id); if(!r.by.length) m.reactions=m.reactions.filter(x=>x!==r); }
  save(); renderMessages();
}
function forwardMsg(id){
  const m=messages.find(x=>x.id===id);
  const list=chats.filter(c=>c.members.includes(currentUser.id)).map(c=>`${c.id}: ${chatTitle(c)}`).join('\n');
  const target=prompt('Куда переслать? Введи id чата:\n'+list);
  if(!target || !chats.find(c=>c.id===target)) return;
  const copy={...m, id:uid(), chatId:target, forwardedFrom:m.senderId, ts:now()};
  messages.push(copy); save(); alert('Переслано'); renderChats();
}
function toggleAttach(){ document.getElementById('attachPanel').classList.toggle('show');}
function triggerPhoto(){ document.getElementById('photoInput').click(); toggleAttach(); }
function handlePhoto(inp){
  const file=inp.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const caption=prompt('Подпись к фото (необязательно):')||'';
    messages.push({id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'photo',content:e.target.result,caption,ts:now(),replyTo,edited:false,pinned:false,reactions:[],read:false});
    replyTo=null; document.getElementById('replyBar').classList.remove('show');
    save(); renderMessages(); renderChats();
  };
  reader.readAsDataURL(file); inp.value='';
}
function sendLocation(){
  toggleAttach();
  if(!navigator.geolocation){
    // demo location Moscow
    const lat=(55.75+Math.random()).toFixed(5), lon=(37.61+Math.random()).toFixed(5);
    messages.push({id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'location',content:`${lat},${lon}`,ts:now(),replyTo,edited:false,pinned:false,reactions:[],read:false});
    save(); renderMessages(); return;
  }
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude, longitude}=pos.coords;
    messages.push({id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'location',content:`${latitude.toFixed(5)},${longitude.toFixed(5)}`,ts:now(),replyTo,edited:false,pinned:false,reactions:[],read:false});
    save(); renderMessages();
  },()=>{
    const lat=(55.75+Math.random()).toFixed(5), lon=(37.61+Math.random()).toFixed(5);
    messages.push({id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'location',content:`${lat},${lon}`,ts:now(),replyTo,edited:false,pinned:false,reactions:[],read:false});
    save(); renderMessages();
  });
}
function sendVideoCircle(){
  toggleAttach();
  // use demo video
  const demoVideo='https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4';
  const url=prompt('Вставь URL видео для кружка (или оставь пустым для демо):', demoVideo) || demoVideo;
  messages.push({id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'video_circle',content:url,ts:now(),replyTo,edited:false,pinned:false,reactions:[],read:false});
  save(); renderMessages();
}
function insertEmoji(){
  const e=prompt('Вставь эмодзи:','😊'); if(!e) return;
  const inp=document.getElementById('msgInput'); inp.value+=e; inp.focus();
  toggleAttach();
}

// voice
function startVoice(e){
  e.preventDefault();
  if(isRecording) return;
  isRecording=true; recordStart=Date.now();
  document.getElementById('recordBtn').classList.add('rec');
  document.getElementById('typingHint').style.display='block';
  document.getElementById('typingHint').textContent='● Запись... отпусти чтобы отправить';
  // fake recording timer
}
function stopVoice(e){
  e.preventDefault();
  if(!isRecording) return;
  isRecording=false;
  document.getElementById('recordBtn').classList.remove('rec');
  document.getElementById('typingHint').style.display='none';
  const dur=Math.max(1, Math.round((Date.now()-recordStart)/1000));
  if(dur<1) return;
  // Create blob URL from oscillator? For demo use dummy audio
  // Use Web Audio beep as placeholder
  messages.push({id:uid(),chatId:activeChatId,senderId:currentUser.id,type:'voice',content:'',duration:dur,ts:now(),replyTo,edited:false,pinned:false,reactions:[],read:false});
  // generate audio blob via WebAudio
  const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const buf=audioCtx.createBuffer(1, audioCtx.sampleRate*dur, audioCtx.sampleRate);
  for(let i=0;i<buf.length;i++) buf.getChannelData(0)[i]= Math.sin(2*Math.PI*440*i/audioCtx.sampleRate)*0.1 * (i<buf.length*0.9?1:0);
  // we won't actually store audio, just show waveform
  save(); renderMessages(); renderChats();
}
function playVoice(btn, src){
  // fake play
  btn.textContent='⏸'; setTimeout(()=>btn.textContent='▶',1200);
}

// right helpers
function toggleRight(){ document.getElementById('right').classList.toggle('open'); }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
function toggleMute(){
  const ch=chats.find(c=>c.id===activeChatId); if(!ch) return;
  ch.muted=!ch.muted; save(); renderChats(); renderHeader(); renderRight();
}
function clearChat(){
  if(!confirm('Очистить все сообщения в этом чате?')) return;
  messages=messages.filter(m=>m.chatId!==activeChatId); save(); renderMessages(); renderChats();
}
function leaveChat(){
  if(!confirm('Удалить / выйти?')) return;
  chats=chats.filter(c=>c.id!==activeChatId);
  messages=messages.filter(m=>m.chatId!==activeChatId);
  activeChatId=null; save(); renderChats(); renderHeader(); renderMessages(); renderRight();
  document.getElementById('chatHeader').style.display='none'; document.getElementById('composer').style.display='none'; document.getElementById('pinned').style.display='none';
}
function startPrivate(login){
  const u=getUserByLogin(login); if(!u) return alert('Нет такого логина');
  let ch=chats.find(c=>c.type==='private' && c.members.includes(u.id) && c.members.includes(currentUser.id));
  if(!ch){ ch={id:uid(),type:'private',title:'',members:[currentUser.id,u.id],owner:currentUser.id,admins:[],desc:'',avatar:'',muted:false}; chats.push(ch); save(); renderChats(); }
  openChat(ch.id);
}
function addMember(){
  const login=document.getElementById('addMemberInput').value.trim(); if(!login) return;
  const u=getUserByLogin(login); if(!u) return alert('Пользователь не найден');
  const ch=chats.find(c=>c.id===activeChatId); if(ch.members.includes(u.id)) return alert('Уже в чате');
  ch.members.push(u.id); save(); renderRight(); renderHeader();
}
function editChat(){
  const ch=chats.find(c=>c.id===activeChatId);
  const name=prompt('Название:', ch.title); if(name!==null) ch.title=name;
  const desc=prompt('Описание:', ch.desc); if(desc!==null) ch.desc=desc;
  save(); renderChats(); renderHeader(); renderRight();
}
function showChatMenu(){
  const ch=chats.find(c=>c.id===activeChatId);
  const act=prompt('Действия: 1-закрепить чат 2-очистить 3-удалить\nВведи номер');
  if(act==='2') clearChat(); if(act==='3') leaveChat();
}
function openLightbox(src){ document.getElementById('lightboxImg').src=src; openModal('lightbox'); }
function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Profile
function openProfile(){
  document.getElementById('pfName').value=currentUser.name;
  document.getElementById('pfLogin').value=currentUser.login;
  document.getElementById('pfBio').value=currentUser.bio||'';
  document.getElementById('pfAvatar').value=currentUser.avatar||'';
  document.getElementById('pfBadge').value=currentUser.badge||'';
  openModal('profileModal');
}
function openProfileOf(id){
  const u=getUser(id); alert(`${u.name} @${u.login}\n${u.bio||''}\nГалочка: ${u.badge||'нет'}`);
}
function saveProfile(){
  const newLogin=document.getElementById('pfLogin').value.trim();
  if(users.some(u=>u.login===newLogin && u.id!==currentUser.id)) return alert('Логин занят');
  currentUser.name=document.getElementById('pfName').value.trim()||currentUser.name;
  currentUser.login=newLogin||currentUser.login;
  currentUser.bio=document.getElementById('pfBio').value;
  currentUser.avatar=document.getElementById('pfAvatar').value.trim();
  currentUser.badge=document.getElementById('pfBadge').value;
  save(); renderMeBar(); renderChats(); renderMessages(); renderRight(); closeModal('profileModal');
}

// Create
function openCreate(type){
  createType=type;
  document.getElementById('createTitle').textContent= type==='private'?'Новый чат': type==='group'?'Новая группа':'Новый канал';
  document.getElementById('createMembersField').style.display= type==='private'?'none':'block';
  document.getElementById('createPrivateField').style.display= type==='private'?'block':'none';
  document.getElementById('createName').value=''; document.getElementById('createDesc').value=''; document.getElementById('createMembers').value=''; document.getElementById('createPrivate').value='';
  openModal('createModal');
}
function doCreate(){
  const name=document.getElementById('createName').value.trim();
  const desc=document.getElementById('createDesc').value.trim();
  if(createType==='private'){
    const login=document.getElementById('createPrivate').value.trim();
    const u=getUserByLogin(login); if(!u) return alert('Пользователь не найден');
    if(chats.some(c=>c.type==='private' && c.members.includes(u.id) && c.members.includes(currentUser.id))) return alert('Чат уже есть');
    const ch={id:uid(),type:'private',title:'',members:[currentUser.id,u.id],owner:currentUser.id,admins:[],desc:'',avatar:'',muted:false};
    chats.push(ch); save(); renderChats(); openChat(ch.id); closeModal('createModal');
  } else {
    if(!name) return alert('Укажи название');
    const membersRaw=document.getElementById('createMembers').value.split(',').map(s=>s.trim()).filter(Boolean);
    const memberIds=[currentUser.id];
    for(const lg of membersRaw){ const u=getUserByLogin(lg); if(u && !memberIds.includes(u.id)) memberIds.push(u.id); }
    const ch={id:uid(),type:createType,title:name,members:memberIds,owner:currentUser.id,admins:[currentUser.id],desc,avatar:'',muted:false, subscribers: createType==='channel'? memberIds : undefined};
    chats.push(ch);
    messages.push({id:uid(),chatId:ch.id,senderId:currentUser.id,type:'system',content: createType==='channel'? `Канал "${name}" создан` : `Группа "${name}" создана`, ts:now(),replyTo:null,edited:false,pinned:false,reactions:[],read:true});
    save(); renderChats(); openChat(ch.id); closeModal('createModal');
  }
}

// Auth
function renderDemo(){
  const el=document.getElementById('demoUsers');
  el.innerHTML='';
  users.forEach(u=>{
    const b=document.createElement('button'); b.className='demo-chip'; b.textContent=`${u.name} @${u.login} ${badgeMap[u.badge]||''}`; b.onclick=()=>{document.getElementById('loginUser').value=u.login; document.getElementById('loginPass').value=u.pass;};
    el.appendChild(b);
  });
}
function doLogin(){
  const login=document.getElementById('loginUser').value.trim();
  const pass=document.getElementById('loginPass').value;
  const u=users.find(x=>x.login===login && x.pass===pass);
  if(!u) return alert('Неверный логин или пароль');
  currentUser=u; localStorage.setItem(LS_SESSION, u.id); showApp();
}
function doRegister(){
  const login=document.getElementById('regLogin').value.trim();
  const name=document.getElementById('regName').value.trim();
  const pass=document.getElementById('regPass').value;
  const avatar=document.getElementById('regAvatar').value.trim();
  const badge=document.getElementById('regBadge').value;
  if(!login||!name||!pass) return alert('Заполни логин, имя и пароль');
  if(pass.length<4) return alert('Пароль минимум 4 символа');
  if(users.some(u=>u.login===login)) return alert('Логин уже занят');
  const u={id:uid(),login,pass,name,bio:'',avatar,badge,online:true};
  users.push(u); save(); currentUser=u; localStorage.setItem(LS_SESSION,u.id); showApp();
}
function logout(){ localStorage.removeItem(LS_SESSION); location.reload(); }
function showApp(){
  document.getElementById('auth').style.display='none';
  document.getElementById('app').classList.add('ready');
  renderFilters(); renderChats(); renderMeBar(); renderMessages(); renderRight();
  // auto open first chat
  const first=chats.find(c=>c.members.includes(currentUser.id));
  if(first) openChat(first.id);
}
