<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth" class="auth">
  <div class="auth-card">
    <div class="auth-logo">✈️</div>
    <h1>Telegram</h1>
    <p>Быстрый и безопасный мессенджер.<br>Вход по номеру телефона — как в оригинале.</p>
    <div id="authStep1" class="auth-form">
      <div class="auth-field">
        <label>Страна</label>
        <select id="country"><option value="+7">Россия +7</option><option value="+375">Беларусь +375</option><option value="+380">Украина +380</option><option value="+77">Казахстан +77</option><option value="+998">Узбекистан +998</option><option value="+1">USA +1</option></select>
      </div>
      <div class="auth-field"><label>Номер телефона</label><input id="phone" placeholder="+7 999 000 00 00" value="+79990000001"></div>
      <div style="padding:12px"><button class="btn-tg" onclick="sendCode()">Далее →</button><div id="devCode" class="code-hint" style="display:none"></div></div>
    </div>
    <div id="authStep2" class="auth-form" style="display:none">
      <div class="auth-field"><label>Код из SMS</label><input id="code" placeholder="12345" maxlength="5"></div>
      <div id="regFields" style="display:none">
        <div class="auth-field"><label>Имя</label><input id="regFirst" placeholder="Алексей"></div>
        <div class="auth-field"><label>Фамилия</label><input id="regLast" placeholder="Волков"></div>
        <div class="auth-field"><label>Юзернейм</label><input id="regUser" placeholder="alex"></div>
      </div>
      <div style="padding:12px"><button class="btn-tg" onclick="verifyCode()">Войти</button><button class="btn-ghost" onclick="backToPhone()">← Назад</button><div id="verifyErr" style="color:#ff6b6b;font-size:12px;margin-top:8px"></div></div>
    </div>
    <p style="margin-top:14px;color:#5a8ab0;font-size:12px">Демо: введи любой номер из списка — код покажется сразу. Тестовый: +79990000001 … +79990000006</p>
  </div>
</div>

<div id="app" class="app">
  <div id="sidebar" class="sidebar">
    <div class="sb-top">
      <button class="menu-btn" onclick="openMenu()">☰</button>
      <div class="search-wrap"><input id="search" placeholder="Поиск" oninput="renderChats()"></div>
    </div>
    <div id="chatList" class="chat-list"></div>
    <div style="padding:8px;border-top:1px solid #101921;display:flex;gap:8px">
      <button class="btn-ghost" style="flex:1" onclick="openCreate('private')">💬 Новый чат</button>
      <button class="btn-ghost" onclick="openCreate('group')">👥 Группа</button>
      <button class="btn-ghost" onclick="openCreate('channel')">📢 Канал</button>
    </div>
  </div>

  <div class="main">
    <div class="mobile-bar"><button class="menu-btn" onclick="toggleSidebar()">☰</button><b style="flex:1;text-align:center">Telegram</b><button class="menu-btn" onclick="toggleRight()">ℹ️</button></div>
    <div id="chatHeader" class="chat-header" style="display:none"></div>
    <div id="pinned" class="pinned-bar" style="display:none" onclick="scrollPinned()"></div>
    <div id="messages" class="messages"><div class="messages-inner" id="messagesInner"></div></div>

    <div id="composer" class="composer" style="display:none">
      <div id="replyBar" class="reply-bar"><div style="flex:1"><b id="replyName" style="color:#5288c1;font-size:13px"></b><div id="replyText" style="color:#a8afb8;font-size:13px"></div></div><button class="icon-btn" onclick="cancelReply()">✕</button></div>
      <div id="editBar" class="reply-bar"><div style="flex:1"><b style="color:#eab308;font-size:13px">Редактирование</b><div id="editText" style="font-size:13px;color:#a8afb8"></div></div><button class="icon-btn" onclick="cancelEdit()">✕</button></div>

      <div class="composer-row">
        <div class="attach">
          <button class="icon-btn" onclick="toggleAttach()">📎</button>
          <div id="attachPanel" class="attach-panel">
            <button onclick="triggerPhoto()">🖼️ Фото или видео</button>
            <button onclick="triggerFile()">📄 Файл</button>
            <button onclick="sendLocation()">📍 Геолокация</button>
            <button onclick="startVideoCircle()">⭕ Видеосообщение</button>
            <button onclick="openGifts()">🎁 Подарок</button>
          </div>
        </div>

        <div class="input-wrap" style="position:relative;flex:1">
          <textarea id="msgInput" rows="1" placeholder="Написать сообщение..." onkeydown="onKey(event)" oninput="autoGrow(this); onTyping()"></textarea>
          <button class="icon-btn" onclick="toggleEmoji()" style="width:32px;height:32px">😊</button>
          <!-- emoji panel inside -->
          <div id="emojiPanel" class="emoji-panel">
            <div class="emoji-head" id="emojiHead"></div>
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
          <div id="giftsPanel" class="gifts-panel">
            <div style="padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #243447"><b>Подарки</b><button class="icon-btn" onclick="toggleGifts()" style="width:28px;height:28px">✕</button></div>
            <div id="giftsGrid" class="gifts-grid"></div>
          </div>
        </div>

        <button id="recordBtn" class="record" title="Зажми для записи" onmousedown="startVoice(event)" onmouseup="stopVoice(event)" ontouchstart="startVoice(event)" ontouchend="stopVoice(event)" ontouchcancel="stopVoice(event)">🎙️</button>
        <button id="sendBtn" class="send" onclick="sendMessage()">➤</button>
      </div>
      <div id="typingHint" class="typing" style="display:none"></div>
      <input id="photoInput" type="file" accept="image/*,video/*" hidden onchange="handlePhoto(this)">
      <input id="fileInput" type="file" hidden onchange="handleFile(this)">
    </div>
  </div>

  <div id="right" class="right">
    <div class="right-head"><span id="rightTitle">Информация</span><button class="icon-btn" onclick="toggleRight()">✕</button></div>
    <div id="rightBody" class="right-body"></div>
  </div>
</div>

<!-- menus -->
<div id="leftDrawer" class="modal" onclick="if(event.target===this)closeLeft()">
  <div style="position:absolute;left:0;top:0;bottom:0;width:300px;background:#17212b;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:8px 0 24px rgba(0,0,0,.4);overflow:auto">
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0">
      <div id="drawerAvatar" style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#5288c1,#2b5278);display:grid;place-items:center;color:#fff;font-weight:700">U</div>
      <div><div id="drawerName" style="font-weight:600">User</div><div id="drawerPhone" style="font-size:12px;color:#a8afb8"></div></div>
    </div>
    <button class="btn-ghost" onclick="openProfile();closeLeft()">⚙️ Настройки</button>
    <button class="btn-ghost" onclick="openCreate('group');closeLeft()">👥 Новая группа</button>
    <button class="btn-ghost" onclick="openCreate('channel');closeLeft()">📢 Новый канал</button>
    <button class="btn-ghost" onclick="openGifts();closeLeft()">🎁 Подарки</button>
    <div style="margin-top:auto"><button class="btn-ghost" style="color:#ff6b6b" onclick="logout()">Выйти</button></div>
  </div>
</div>

<div id="createModal" class="modal" onclick="if(event.target===this)closeModal('createModal')">
  <div class="modal-card">
    <h3 id="createTitle">Создать</h3>
    <div class="field"><label>Название</label><input id="createName" placeholder="Название"></div>
    <div class="field"><label>Юзернейм (для канала, без @)</label><input id="createUsername" placeholder="my_channel"></div>
    <div class="field"><label>Описание</label><textarea id="createDesc" rows="2"></textarea></div>
    <div id="createMembersField" class="field"><label>Добавить участников (юзернеймы через запятую)</label><input id="createMembers" placeholder="maria, dima"></div>
    <div id="createPrivateField" class="field" style="display:none"><label>Юзернейм собеседника</label><input id="createPrivate" placeholder="anna"></div>
    <div class="row"><button class="btn-ghost" onclick="closeModal('createModal')">Отмена</button><button class="btn-tg" onclick="doCreate()">Создать</button></div>
  </div>
</div>

<div id="profileModal" class="modal" onclick="if(event.target===this)closeModal('profileModal')">
  <div class="modal-card">
    <h3>Настройки</h3>
    <div class="field"><label>Имя</label><input id="pfFirst"></div>
    <div class="field"><label>Фамилия</label><input id="pfLast"></div>
    <div class="field"><label>Юзернейм</label><input id="pfUser"></div>
    <div class="field"><label>О себе</label><textarea id="pfBio" rows="2"></textarea></div>
    <div class="field"><label>Аватар URL</label><input id="pfAvatar"></div>
    <div class="field"><label>Галочка</label>
      <select id="pfBadge"><option value="">Нет</option><option value="blue">Синяя ✓</option><option value="gold">Золотая</option><option value="green">Зелёная</option><option value="premium">Premium</option></select>
    </div>
    <div class="row"><button class="btn-ghost" onclick="closeModal('profileModal')">Закрыть</button><button class="btn-tg" onclick="saveProfile()">Сохранить</button></div>
  </div>
</div>

<div id="lightbox" class="modal" onclick="closeModal('lightbox')"><img id="lightboxImg" style="max-width:90vw;max-height:90vh;border-radius:12px"></div>
<div id="videoModal" class="modal" onclick="if(event.target===this)closeModal('videoModal')">
  <div class="modal-card" style="max-width:420px;text-align:center">
    <h3>Видеосообщение — кружок</h3>
    <video id="vcPreview" autoplay muted playsinline style="width:220px;height:220px;border-radius:50%;background:#000;object-fit:cover;margin:10px auto;display:block"></video>
    <canvas id="vcCanvas" width="320" height="320" style="display:none"></canvas>
    <div class="row"><button class="btn-ghost" onclick="closeModal('videoModal')">Отмена</button><button id="vcRecBtn" class="btn-tg" onclick="toggleVcRec()">● Запись</button><button class="btn-tg" onclick="sendVc()">Отправить</button></div>
    <div id="vcStatus" style="font-size:12px;color:#a8afb8;margin-top:6px"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
